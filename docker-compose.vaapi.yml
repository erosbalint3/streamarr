# Intel Quick Sync / AMD GPU transcoding via VAAPI.
# The container detects the GPU's group automatically – no group ids needed.
services:
  streamarr:
    devices:
      - /dev/dri:/dev/dri
    environment:
      HWACCEL: vaapi
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
      MAX_SOFTWARE_HEIGHT: 2160
