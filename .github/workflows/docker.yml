name: Build & publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server syntax check
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Build web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        if: github.event_name != 'pull_request'
        run: |
          # Reproduce the common first-run setup: a root-owned bind mount (as Docker creates it).
          sudo mkdir -p /tmp/sa-data/cache/images && sudo chown -R root:root /tmp/sa-data
          docker run -d --name sa -p 8420:8420 -e PUID=1000 -e PGID=1000 -v /tmp/sa-data:/config \
            ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)
          for i in $(seq 1 30); do curl -fs localhost:8420/api/health && break; sleep 2; done
          curl -fs localhost:8420/api/auth/status
          test "$(stat -c '%u' /tmp/sa-data/cache)" = "1000"
          test -f /tmp/sa-data/streamarr.db
          docker exec sa sh -c 'cat /proc/1/status /proc/$(pgrep -f "server/src/index.js")/status | grep -E "^Uid"'
          docker exec sa ffmpeg -hide_banner -encoders | grep -E "libx264|h264_vaapi|h264_nvenc"
          docker exec sa ffmpeg -hide_banner -filters | grep -E " zscale| tonemap | scale_vaapi| scale_cuda"
          docker logs sa
